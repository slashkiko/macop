name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swiftlang/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install lint and format tools
        run: brew install swiftformat swiftlint

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
