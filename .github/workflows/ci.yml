name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Swift
        uses: swift-actions/setup-swift@d4537ff835c9778c934e48f78639e270edd5839e # v2.2.0
        with:
          swift-version: "6.2"

      - name: Verify action pins
        run: |
          brew install pinact
          make pin-actions-check

      - name: Install lint and format tools
        run: brew install swiftformat swiftlint

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
