name: Update action pins

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinact
        run: brew install pinact

      - name: Update pinned action SHAs
        run: make pin-actions

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update pinned GitHub Actions"
          branch: chore/update-action-pins
          delete-branch: true
          title: "chore: update pinned GitHub Actions"
          body: |
            Automated update of SHA-pinned GitHub Actions via pinact.
