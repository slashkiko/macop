name: Swift quality

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "scripts/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".mise.toml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "scripts/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".mise.toml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Restore SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swiftpm-quality-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-quality-
      - name: Run Swift quality and helper fixtures
        run: make ci-swift
      - name: Run deterministic interactive relay fixture
        run: make test-pty
