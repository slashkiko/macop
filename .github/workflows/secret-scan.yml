name: Secret scan

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/**"
      - ".githooks/**"
      - "Package.swift"
      - "Makefile"
      - ".mise.toml"
      - "README.md"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/**"
      - ".githooks/**"
      - "Package.swift"
      - "Makefile"
      - ".mise.toml"
      - "README.md"

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Run betterleaks scan
        run: make secret-scan
