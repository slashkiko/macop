name: Workflow governance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".pinact.yml"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".pinact.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Verify action pins
        run: make pin-actions-check

  workflow-lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Run actionlint
        run: make workflow-lint

  workflow-security:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflow-security
