name: Workflow governance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".pinact.yml"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".pinact.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Verify action pins
        run: make pin-actions-check

  workflow-lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Run actionlint
        run: make workflow-lint

  workflow-security:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflow-security
